schema_version: 1

context:
  name: embetter
  version: "0.9.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/82/56/e0adb27078ae422948b802d3c99cfdcc4ed683b4b50955eed992e30b482a/embetter-${{ version }}.tar.gz
  sha256: a1c70b20f9b53415d26287580ec60b390938328f87b9e282f66643a1d6b5b8f0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=68.0
    - wheel
  run:
    - python >=${{ python_min }}
    - scikit-learn >=1.0.0
    - pandas >=1.0.0
    - diskcache >=5.6.1
    - skops >=0.8.0
    - model2vec

tests:
  - python:
      imports:
        - embetter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Scikit-learn compatible embeddings for computer vision and text
  license: MIT
  license_file: LICENCE
  homepage: https://koaning.github.io/embetter/
  repository: https://github.com/koaning/embetter

extra:
  recipe-maintainers:
    - thewchan
